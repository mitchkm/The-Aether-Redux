name: Build

on: 
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch name, tag, or commit SHA to check out'
        required: true
        default: 'main'
        type: string

jobs:
 build:
   runs-on: ubuntu-24.04
   permissions:
     contents: read
     packages: read
   steps:

     - name: Checkout repository
       uses: actions/checkout@v4
       with:
         ref: ${{ inputs.target_ref }}
         fetch-depth: 0
         fetch-tags: true

     - name: Setup JDK 21
       uses: actions/setup-java@v4
       env:
         GITHUB_TOKEN: ${{ github.token }}
         GITHUB_ACTOR: ${{ github.actor }}
       with:
         distribution: 'temurin'
         java-version: '21'
         cache: gradle

     - name: Set Gradle file to be executable
       run: chmod +x gradlew

     - name: Setup Gradle
       uses: gradle/actions/setup-gradle@v4

     - name: Build with Gradle
       env:
           GITHUB_TOKEN: ${{ github.token }}
           GITHUB_ACTOR: ${{ github.actor }}
       run: ./gradlew build

     - name: Store original JAR name as output and rename JAR
       id: jar-name
       working-directory: build/libs
       run: |
         filename=$(echo $(ls | head -n 1 | sed 's/\.[^.]*$//'))
         echo "ARTIFACT_NAME=$(echo $filename)" >> $GITHUB_OUTPUT
         echo "Stored artifact name as \"$filename\"";
         mv $filename.jar $filename-bleeding-edge.jar

     - name: Upload JAR
       uses: actions/upload-artifact@v4
       with:
         name: "${{ steps.jar-name.outputs.ARTIFACT_NAME }}-EXTRACT-ME"
         path: "build/libs/*"
